name: CI

on:
  push:
    branches: [main]
  pull_request:

# Токену CI нужно только чтение; запись (тег и релиз) — у release.yml
permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Известные уязвимости в зависимостях, попадающих на сервер панели, блокируют CI
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # Известные уязвимости в зависимостях, попадающих на сервер панели, блокируют CI
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # CSP панели (font-src 'self') блокирует встроенные data:-шрифты и внешние ресурсы
      - run: |
          ! grep -lE 'data:font|fonts.googleapis|url\(https?:' dist/assets/*.css

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash -n install.sh && bash -n server/src/scripts/update-awg.sh && bash -n server/src/scripts/deploy-awg.sh && bash -n server/src/scripts/deploy-bridge.sh && bash -n server/src/scripts/update-panel.sh && bash -n server/test/docker/nodes.sh && bash -n server/test/docker/entrypoint.sh && bash -n server/test/install/run.sh && bash -n server/test/install/in-container.sh && bash -n server/test/install/common.sh && bash -n server/test/install/migration-old.sh && bash -n server/test/install/migration-new.sh && bash -n server/test/install/upgrade.sh && bash -n .github/scripts/release.sh
      - run: shellcheck -S error server/src/scripts/update-awg.sh install.sh server/src/scripts/deploy-awg.sh server/src/scripts/deploy-bridge.sh server/src/scripts/update-panel.sh server/test/docker/nodes.sh server/test/docker/entrypoint.sh server/test/install/run.sh server/test/install/in-container.sh server/test/install/common.sh server/test/install/migration-old.sh server/test/install/migration-new.sh server/test/install/upgrade.sh .github/scripts/release.sh

  # install.sh целиком в чистом Ubuntu: настоящие apt, Node.js, сборка и запуск; проверяет случайные логин/пароль и вывод данных
  # подключения, перенос панели между двумя контейнерами и обновление работающей панели с предыдущего релиза (нужны теги: fetch-depth 0).
  # Сбой установки блокирует CI и автоматический релиз.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: bash server/test/install/run.sh

  # Реальные ноды (Docker-in-Docker с SSH): весь набор тестов, включая real-*.test.ts.
  # Сбой критических сценариев блокирует CI и автоматический релиз.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: bash test/docker/nodes.sh up
      - run: npm test
      - if: always()
        run: bash test/docker/nodes.sh down
